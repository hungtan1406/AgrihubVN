<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" fill="none">
  <defs>
    <!-- Sky & Atmosphere Gradient -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#092015"/>
      <stop offset="35%" stop-color="#0E2F20"/>
      <stop offset="70%" stop-color="#14432D"/>
      <stop offset="100%" stop-color="#1C583C"/>
    </linearGradient>

    <!-- Warm Golden Sun Beam -->
    <radialGradient id="sunGlow" cx="1600" cy="240" r="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E2B13C" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#E2B13C" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0E2F20" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#184A33" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0E2F20" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E5C3F" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0B261A" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#246F4C" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#071911" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Deep Forest Background -->
  <rect width="1920" height="1080" fill="url(#skyGrad)"/>

  <!-- Sun Rays & Glow from top right -->
  <rect width="1920" height="1080" fill="url(#sunGlow)"/>

  <!-- Geometric Sun Rays -->
  <g opacity="0.15">
    <polygon points="1600,240 1920,0 1800,0" fill="#FCE79D"/>
    <polygon points="1600,240 1920,350 1920,480" fill="#FCE79D"/>
    <polygon points="1600,240 1920,700 1750,800" fill="#FCE79D"/>
    <polygon points="1600,240 1400,950 1200,850" fill="#FCE79D"/>
    <polygon points="1600,240 900,600 800,450" fill="#FCE79D"/>
  </g>

  <!-- Rolling Hills & Agricultural Terraces (Landscape of Vietnam) -->
  <!-- Layer 3: Distant Mountain Range -->
  <path d="M0 640 Q 320 520, 680 580 T 1380 540 T 1920 590 L 1920 1080 L 0 1080 Z" fill="url(#hillFar)"/>

  <!-- Layer 2: Mid Hills & Orchards -->
  <path d="M0 720 Q 420 620, 850 690 T 1550 650 T 1920 730 L 1920 1080 L 0 1080 Z" fill="url(#hillMid)"/>

  <!-- Layer 1: Foreground Terraces -->
  <path d="M0 840 Q 350 740, 800 800 T 1450 780 T 1920 860 L 1920 1080 L 0 1080 Z" fill="url(#hillNear)"/>

  <!-- Decorative stylized agricultural patterns on right side -->
  <g transform="translate(1350, 480)" opacity="0.18">
    <!-- Stylized Mango silhouette -->
    <path d="M120 0 C220 20 280 140 240 260 C200 380 80 380 20 300 C-40 220 -20 100 60 30 C80 10 100 0 120 0 Z" fill="#E2B13C"/>
    <!-- Leaf on top -->
    <path d="M120 -10 Q 180 -60 220 -40 Q 170 10 120 -10 Z" fill="#4ADE80"/>
  </g>

  <g transform="translate(1620, 640)" opacity="0.15">
    <!-- Stylized Passion fruit flower / cross section circle -->
    <circle cx="100" cy="100" r="90" stroke="#FCE79D" stroke-width="6" fill="#14432D"/>
    <circle cx="100" cy="100" r="70" stroke="#E2B13C" stroke-width="3" stroke-dasharray="8 6"/>
    <circle cx="100" cy="100" r="45" fill="#E2B13C" fill-opacity="0.4"/>
  </g>

  <g transform="translate(1100, 720)" opacity="0.12">
    <!-- Stylized Dragon fruit slice / seeds pattern -->
    <circle cx="80" cy="80" r="75" stroke="#FB7185" stroke-width="5" fill="#0E2F20"/>
    <circle cx="80" cy="80" r="55" fill="#FFFFFF" fill-opacity="0.1"/>
  </g>

  <!-- Bottom Vignette / Subtle Gradient for clean content readability -->
  <rect y="700" width="1920" height="380" fill="url(#hillNear)" opacity="0.4"/>
</svg>
