<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 140" width="280" height="140" fill="none">
  <!-- Card background & subtle border -->
  <rect x="2" y="2" width="276" height="136" rx="18" fill="#F8FAFC" stroke="#0284C7" stroke-width="1.5" stroke-opacity="0.35"/>
  
  <!-- Outer decorative badge -->
  <g transform="translate(68, 70)">
    <!-- Round emblem -->
    <circle cx="0" cy="0" r="50" fill="#0C4A6E"/>
    <circle cx="0" cy="0" r="44" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 2.5"/>
    <circle cx="0" cy="0" r="36" fill="#082F49"/>
    
    <!-- Dynamic FSSC curved waves -->
    <path d="M-22 8 C-10 -18 10 -18 22 8" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
    <path d="M-15 16 C-5 -4 5 -4 15 16" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.6" stroke-linecap="round"/>
    <circle cx="0" cy="-6" r="4" fill="#38BDF8"/>
    <!-- Checkmark inside -->
    <path d="M-6 4 L-1 9 L8 0" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Typography -->
  <g transform="translate(136, 42)">
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#0C4A6E" letter-spacing="1">FSSC 22000</text>
    <rect x="0" y="10" width="130" height="2" fill="#0284C7" rx="1"/>
    <text x="0" y="26" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#0284C7" letter-spacing="0.6">FOOD SAFETY SYSTEM</text>
    <text x="0" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#475569" letter-spacing="0.4">CERTIFICATION</text>
    <text x="0" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="600" fill="#64748B" letter-spacing="0.2">GFSI BENCHMARKED</text>
    <text x="0" y="68" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="800" fill="#0C4A6E" letter-spacing="0.5">✓ GLOBAL COMPLIANCE</text>
  </g>
</svg>
