<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 140" width="280" height="140" fill="none">
  <!-- Card background & subtle border -->
  <rect x="2" y="2" width="276" height="136" rx="18" fill="#FDFBFB" stroke="#BE123C" stroke-width="1.5" stroke-opacity="0.3"/>
  
  <!-- Outer decorative emblem -->
  <g transform="translate(68, 70)">
    <!-- ISO round container -->
    <circle cx="0" cy="0" r="50" fill="#9F1239"/>
    <circle cx="0" cy="0" r="44" fill="none" stroke="#FDA4AF" stroke-width="2" stroke-dasharray="4 2.5"/>
    <rect x="-26" y="-22" width="52" height="44" rx="8" fill="#BE123C"/>
    <!-- ISO text -->
    <text x="0" y="8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">ISO</text>
  </g>
  
  <!-- Typography -->
  <g transform="translate(136, 42)">
    <text x="0" y="0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#881337" letter-spacing="1">22000:2018</text>
    <rect x="0" y="10" width="130" height="2" fill="#E11D48" rx="1"/>
    <text x="0" y="26" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800" fill="#BE123C" letter-spacing="0.6">FOOD SAFETY SYSTEM</text>
    <text x="0" y="40" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#475569" letter-spacing="0.4">MANAGEMENT STANDARD</text>
    <text x="0" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="600" fill="#64748B" letter-spacing="0.2">INTERNATIONAL ACCREDITED</text>
    <text x="0" y="68" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="800" fill="#881337" letter-spacing="0.5">✓ STANDARDS AUDITED</text>
  </g>
</svg>
